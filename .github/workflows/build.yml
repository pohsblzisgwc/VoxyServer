name: Build and Release

on:
  push:
    branches: [ "26.3", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "26.3", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download Voxy dependency
        run: |
          mkdir -p libs
          curl -sSLf --retry 3 --retry-delay 2 -o libs/voxy-26.3.jar "https://cdn.modrinth.com/data/fxxUqruK/versions/iIrM8ZKQ/voxy-0.2.20-beta.jar"
          test -s libs/voxy-26.3.jar || { echo "Failed to download valid voxy jar"; exit 1; }
          ls -lh libs/

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Generate Checksums
        run: |
          cd build/libs
          sha256sum *.jar > checksums-sha256.txt
          cat checksums-sha256.txt
          cd ../..

      - name: List built artifacts
        run: ls -la build/libs/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxyServer-artifacts
          path: build/libs/*

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VoxyServer ${{ github.ref_name }} (Fabric 26.3)
          previous_tag: v1.2.5
          generate_release_notes: true
          body: |
            Protocol 4 requires updating the client and server together.

            Inventory refreshes now commit complete, bounded snapshots with frozen ranges and scoped ACK fencing. Section reuse compares semantic block, biome, light, and voxel content. Rollbacks replace client data only when the server has actual section data; client-only cached terrain is preserved.
          files: |
            build/libs/*.jar
            build/libs/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
